name: Build frontend assets

# The Vercel PHP runtime does not run Vite, so compiled assets (public/build) are committed.
# This keeps them in sync whenever the frontend source changes.
on:
  push:
    branches: [main]
    paths:
      - 'resources/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'tailwind.config.js'
      - 'postcss.config.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit built assets
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/build
          if git diff --cached --quiet; then
            echo "No asset changes."
          else
            git commit -m "chore: rebuild frontend assets"
            git push
          fi
