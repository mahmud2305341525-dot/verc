name: Migrate TiDB database

# Vercel can't run `artisan migrate`, so migrations run here against TiDB Cloud.
# Runs automatically when migration files change on main, or manually from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - 'database/migrations/**'
  workflow_dispatch:
    inputs:
      seed:
        description: 'Seed roles + safe havens (ProductionSeeder). Safe to re-run.'
        type: boolean
        default: false

concurrency:
  group: migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      APP_ENV: production
      APP_KEY: ${{ secrets.APP_KEY }}
      DB_CONNECTION: mysql
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_DATABASE: ${{ secrets.DB_DATABASE }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_SSL: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, openssl, fileinfo
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Run migrations
        run: php artisan migrate --force

      - name: Seed roles and map data
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.seed }}
        run: php artisan db:seed --class=ProductionSeeder --force
